name: Build launcher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform 37 preview and build tools
        # NOTE: do NOT use android-actions/setup-android here — its default
        # package list includes "tools", which no longer exists in the SDK
        # repository ("Failed to find package 'tools'"), failing the run in
        # ~20s. The ubuntu runner already ships ANDROID_HOME +
        # cmdline-tools, so install straight from the preinstalled sdkmanager.
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.2-beta3" "build-tools;37.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ios-launcher-apk
          path: app/build/outputs/apk/release/app-release.apk
